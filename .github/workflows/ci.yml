---
name: CI
on:
  push:
    branches: [main, master]
  pull_request:

# Validate-only: format, lint, tests. No publishing until the structure
# stabilises.
#
# The toolchain is installed with apt/npm rather than entered through a nix
# devShell. The flake that shell came from is gone (ARCHITECTURE.md), and with
# it the second delivery path CI used to evaluate.
#
# Two things `just check` does locally are deliberately NOT here, both for
# the same reason — they need Quickshell itself, which is not packaged for
# this runner:
#
#   * `smoke` boots the real shell (`qs`), which also wants a Wayland
#     session;
#   * `qmllint` resolves every type through Quickshell's own QML modules.
#     Without them EVERY root type is unknown — `ShellRoot was not found`,
#     10047 warnings in one run — so it fails on the import path, says
#     nothing about the code, and is worth exactly nothing here. It stays a
#     local gate, where the modules exist.
#
# Everything else runs, including the privacy gate, which lives in the
# sibling `hypr` repo — so that repo is checked out beside this one, the
# same layout a developer has.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the shell
        uses: actions/checkout@v4
        with:
          path: quickshell

      # The privacy gate is `hypr/bin/,privacy-check`, resolved as `../hypr`
      # from this repo — the sibling layout every checkout here uses.
      # Two siblings, both resolved by relative path from this repo — the
      # layout a developer already has. `hypr` carries the privacy gate;
      # `system-config` carries `docs/stores.md`, the store registry the
      # classification test checks every schema against.
      - name: Check out the sibling hypr repo (privacy gate)
        uses: actions/checkout@v4
        with:
          repository: quantumfate/hypr
          path: hypr

      - name: Check out the sibling system-config repo (store registry)
        uses: actions/checkout@v4
        with:
          repository: quantumfate/system-config
          path: system-config

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            just shfmt yamllint
          # Pinned: prettier's markdown table formatting changed between
          # 3.8 and 3.9, so an unpinned CI disagrees with the version the
          # repo was formatted by and fails on files nobody touched.
          sudo npm install -g prettier@3.8.1

      - name: Gate
        working-directory: quickshell
        run: just fmt-check tokens test

      - name: Privacy gate
        working-directory: quickshell
        run: ../hypr/bin/,privacy-check
