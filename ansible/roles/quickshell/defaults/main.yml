---
quickshell_config_name: quantumfate
quickshell_repo_path: "{{ playbook_dir }}/.."

# XDG state root the shell's Store files live under: the shared quantum-store
# directory. QF_STORE (the env the whole desk agrees on) takes precedence;
# otherwise one dir deeper than the state home.
quickshell_state_home: >-
  {{ ansible_facts.env.QF_STORE
     | default((ansible_facts.env.XDG_STATE_HOME
                | default(ansible_facts.user_dir + '/.local/state')) ~ '/quantum-store') }}

quickshell_install_packages: true
quickshell_packages:
  # --- core shell ---
  - quickshell # the shell itself
  - qt6-declarative # qmlls6 + QtQuick modules
  - qt6-svg # tray/icon rendering (Quickshell.Services.SystemTray)
  - qt6-5compat # Qt5Compat.GraphicalEffects (blur/shadow in QML) — not a quickshell hard dep
  - upower # Quickshell.Services.UPower (battery/power) — service backend
  - ttf-jetbrains-mono-nerd # bar font + nerd-font glyphs
  # --- shell-side helpers invoked from QML / bindings ---
  - jq # store queries + Hypr/SysStats/DofusWindows probes
  - libnotify # notify-send → the Notify daemon (below)
  - xdotool # window rename IPC + launch renaming
  - uwsm # session-scoped autostart
  - iproute2 # SysStats default-iface probe (ip route)
  - gawk # SysStats probe field parsing (awk)
  - procps-ng # DofusSwap detector state (pgrep/pkill)
  - curl # Weather widget (wttr.in)
  - xdg-utils # Weather click (xdg-open)
  # util-linux (setsid, DofusSwap) + coreutils (df/tr, SysStats) are in `base`.
  # --- bar module backends (invoked directly by bar widgets) ---
  - networkmanager # SysStats wifi probe (nmcli)

quickshell_disable_mako: true

quickshell_install_zsh_completions: true
quickshell_completion_dir: "{{ ansible_facts.user_dir }}/.local/share/zsh/site-functions"
quickshell_completions:
  - _qs
  - _qfs

quickshell_install_extra_packages: false
quickshell_extra_packages:
  - python-pillow
  - python-imagehash
  - grim
  - slurp
  - xdotool
