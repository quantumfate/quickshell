; qmllint / qmlls warning configuration for this Quickshell project.
;
; Quickshell uses idioms the stock Qt QML tooling can't model:
;   - the `root:/…` import scheme (resolved by Quickshell at runtime), which
;     qmllint reports as a failed/unknown import; and
;   - module singletons (Theme, DofusState, Config, …) reached through those
;     imports, which then cascade into "unqualified access" on every use.
; Both are false positives here, so silence just those two categories. All other
; checks (deprecations, type errors, layout/required-property hints, …) stay on.
[General]
ImportFailure=disable
UnqualifiedAccess=disable
